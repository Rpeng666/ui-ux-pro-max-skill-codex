name: Sync Upstream

# Automatically merges upstream changes into this fork.
# Runs weekly + can be triggered manually from the Actions tab.
#
# We only customized 2 upstream files (README.md, .gitignore);
# everything else is new files that won't conflict.
# On conflict, we keep our versions of those 2 files.

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch: {}   # Manual button in Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for merge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          if [ "$LOCAL" = "$UPSTREAM" ] || git merge-base --is-ancestor upstream/main HEAD; then
            echo "No upstream changes to merge"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream has new commits"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.check.outputs.has_changes == 'true'
        run: |
          set -e
          
          # Attempt a normal merge
          if ! git merge upstream/main --no-edit; then
            # Conflicts occurred
            # Keep our versions of files we customized
            for f in README.md .gitignore; do
              if git diff --name-only --diff-filter=U | grep -q "^${f}$"; then
                echo "Resolving conflict: keeping ours for $f"
                git checkout --ours "$f"
                git add "$f"
              fi
            done
            
            # Fail if there are unexpected conflicts in other files
            REMAINING=$(git diff --name-only --diff-filter=U)
            if [ -n "$REMAINING" ]; then
              echo "ERROR: Unresolved conflicts in files we did not customize:"
              echo "$REMAINING"
              echo "Manual intervention required."
              exit 1
            fi
            
            git commit --no-edit
          fi

      - name: Setup Node
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild SKILL.md
        if: steps.check.outputs.has_changes == 'true'
        run: node scripts/build-codex-skill.mjs

      - name: Commit rebuilt SKILL.md
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git add dist/SKILL.md
          git diff --staged --quiet || git commit -m "chore: rebuild SKILL.md after upstream sync"

      - name: Push
        if: steps.check.outputs.has_changes == 'true'
        run: git push origin HEAD:main

      - name: Create PR on conflict failure
        if: failure() && steps.check.outputs.has_changes == 'true'
        run: |
          # If merge failed with unexpected conflicts, create a PR for manual review
          git checkout -b sync-upstream-$(date +%Y%m%d)
          git push origin HEAD
          gh pr create \
            --title "sync: upstream merge (manual resolution needed)" \
            --body "Automatic upstream sync failed due to conflicts in files we did not customize. Please review and resolve manually." \
            --label "upstream-sync" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
